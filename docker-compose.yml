services:

  enterprise-ai-platform:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: enterprise-ai-platform

    ports:
      - "8000:8000"

    volumes:
      - ./reports:/app/reports

    environment:
      PYTHONUNBUFFERED: "1"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s